<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Solution Anything</title>
<meta name="description" content="Salesforce consultancy and AppExchange apps. Creators of the Any+ suite — calendar, kanban, gantt and hierarchy components for Lightning record pages.">
<meta property="og:title" content="Solution Anything">
<meta property="og:description" content="Salesforce consultancy and AppExchange apps. Creators of the Any+ suite.">
<meta name="twitter:card" content="summary">

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&family=IBM+Plex+Mono:wght@400;500&display=swap">

<style>
:root {
  --bg: #FAFBFC;
  --fg: #1B2332;
  --fg-muted: #5A6577;
  --accent: #0B6FCC;
  --accent-hover: #0958A5;
  --surface: #FFFFFF;
  --surface-border: #E2E6EC;
  --radius: 12px;
  --font: 'DM Sans', system-ui, sans-serif;
  --mono: 'IBM Plex Mono', ui-monospace, monospace;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #0F1218;
    --fg: #E4E8EE;
    --fg-muted: #8A93A5;
    --accent: #5BA3E6;
    --accent-hover: #7BB8EF;
    --surface: #1A1F2B;
    --surface-border: #2A3040;
    color-scheme: dark;
  }
}

*, *::before, *::after { box-sizing: border-box; margin: 0; }

body {
  font-family: var(--font);
  background: var(--bg);
  color: var(--fg);
  line-height: 1.6;
  min-height: 100dvh;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 2rem max(1rem, env(safe-area-inset-left, 0px));
  text-align: center;
}

.container {
  max-width: 540px;
  width: 100%;
}

.logo {
  font-size: 1.75rem;
  font-weight: 700;
  letter-spacing: -0.02em;
  margin-bottom: 0.25rem;
}

.logo span {
  color: var(--accent);
}

.tagline {
  color: var(--fg-muted);
  font-size: 1.05rem;
  margin-bottom: 2.5rem;
}

.apps {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 1rem;
  margin-bottom: 2.5rem;
}

@media (max-width: 480px) {
  .apps { grid-template-columns: repeat(2, 1fr); }
}

.app {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 0.5rem;
  padding: 1rem 0.5rem;
  background: var(--surface);
  border: 1px solid var(--surface-border);
  border-radius: var(--radius);
  text-decoration: none;
  color: var(--fg);
  transition: border-color 0.15s;
}

.app:hover {
  border-color: var(--accent);
}

.app-icon {
  width: 48px;
  height: 48px;
  border-radius: 10px;
  background: linear-gradient(135deg, #0B6FCC, #0958A5);
  display: flex;
  align-items: center;
  justify-content: center;
}

.app-icon svg {
  width: 28px;
  height: 28px;
}

.app-name {
  font-size: 0.8rem;
  font-weight: 600;
  font-family: var(--mono);
}

.cta {
  color: var(--fg-muted);
  font-size: 0.95rem;
  margin-bottom: 1rem;
}

.contact {
  display: inline-block;
  padding: 0.65rem 1.5rem;
  background: var(--accent);
  color: #fff;
  font-family: var(--font);
  font-size: 0.95rem;
  font-weight: 600;
  border: none;
  border-radius: 8px;
  text-decoration: none;
  transition: background 0.15s;
}

.contact:hover {
  background: var(--accent-hover);
}

footer {
  margin-top: 3rem;
  color: var(--fg-muted);
  font-size: 0.8rem;
}
</style>
</head>
<body>

<div class="container">
  <div class="logo">Solution<span>Anything</span></div>
  <p class="tagline">Salesforce consultancy &amp; AppExchange apps</p>

  <div class="apps">
    <a class="app" href="https://yanandroo-code.github.io/anycalplus-site/" title="AnyCal+">
      <div class="app-icon">
        <svg viewBox="0 0 28 28" fill="none"><rect x="4" y="3" width="20" height="18" rx="3" stroke="#fff" stroke-width="1.8" fill="none"/><line x1="4" y1="8" x2="24" y2="8" stroke="#fff" stroke-width="1.8"/><circle cx="10" cy="13" r="1.3" fill="#fff"/><circle cx="18" cy="13" r="1.3" fill="#fff"/><circle cx="10" cy="17.5" r="1.3" fill="#fff"/><circle cx="14" cy="17.5" r="1.3" fill="#fff"/><line x1="9" y1="3" x2="9" y2="1" stroke="#fff" stroke-width="1.8" stroke-linecap="round"/><line x1="19" y1="3" x2="19" y2="1" stroke="#fff" stroke-width="1.8" stroke-linecap="round"/></svg>
      </div>
      <span class="app-name">AnyCal+</span>
    </a>

    <a class="app" href="https://yanandroo-code.github.io/anykanbanplus-site/" title="AnyKanban+">
      <div class="app-icon">
        <svg viewBox="0 0 28 28" fill="none"><rect x="4" y="6" width="5.5" height="16" rx="1.5" fill="#fff"/><rect x="11.25" y="6" width="5.5" height="10" rx="1.5" fill="#fff"/><rect x="18.5" y="6" width="5.5" height="13" rx="1.5" fill="#fff"/></svg>
      </div>
      <span class="app-name">AnyKanban+</span>
    </a>

    <a class="app" href="https://yanandroo-code.github.io/anyganttplus-site/" title="AnyGantt+">
      <div class="app-icon">
        <svg viewBox="0 0 28 28" fill="none"><rect x="6" y="6" width="14" height="3.5" rx="1.5" fill="#fff"/><rect x="10" y="12" width="12" height="3.5" rx="1.5" fill="#fff"/><rect x="8" y="18" width="10" height="3.5" rx="1.5" fill="#fff"/></svg>
      </div>
      <span class="app-name">AnyGantt+</span>
    </a>

    <a class="app" href="https://yanandroo-code.github.io/anyrecordhierarchyplus-site/" title="AnyRecordHierarchy+">
      <div class="app-icon">
        <svg viewBox="0 0 28 28" fill="none"><circle cx="14" cy="7" r="3" stroke="#fff" stroke-width="1.8" fill="none"/><circle cx="7" cy="21" r="2.5" stroke="#fff" stroke-width="1.6" fill="none"/><circle cx="14" cy="21" r="2.5" stroke="#fff" stroke-width="1.6" fill="none"/><circle cx="21" cy="21" r="2.5" stroke="#fff" stroke-width="1.6" fill="none"/><line x1="14" y1="10" x2="7" y2="18.5" stroke="#fff" stroke-width="1.5"/><line x1="14" y1="10" x2="14" y2="18.5" stroke="#fff" stroke-width="1.5"/><line x1="14" y1="10" x2="21" y2="18.5" stroke="#fff" stroke-width="1.5"/></svg>
      </div>
      <span class="app-name">AnyHierarchy+</span>
    </a>
  </div>

  <p class="cta">Something to build? Let's talk.</p>
  <a class="contact" href="mailto:yan@solutionanything.co.uk">Get in touch</a>

  <footer>&copy; 2026 Solution Anything</footer>
</div>

</body>
</html>
